[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-document-pipeline-toolkit"
version = "0.1.0"
description = "Installable toolkit + CLI for building RAG-ready document ingestion pipelines over financial-services data sources (portfolio demo, fictional bank data only)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Portfolio Project" }]
keywords = ["rag", "langchain", "data-pipeline", "mlops", "document-ingestion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries",
]

# Pinned with minimum-secure-version lower bounds and a same-major upper
# bound, per this repo's SECURITY.md policy: reproducible builds without
# freezing out compatible patch releases.
dependencies = [
    "langchain-text-splitters>=0.3.0,<0.4.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "typer>=0.15.1,<0.16.0",
    "rich>=13.7.1,<14.0.0",
    "tenacity>=8.3.0,<9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.5.0,<0.6.0",
    "mypy>=1.10.0,<2.0.0",
    "build>=1.2.1,<2.0.0",
]

[project.scripts]
toolkit = "toolkit.cli:app"

[tool.setuptools.packages.find]
include = ["toolkit*"]

[tool.setuptools.package-data]
toolkit = ["py.typed"]

[tool.ruff]
line-length = 115
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
