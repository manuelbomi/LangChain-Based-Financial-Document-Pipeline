# Runs the ingest/reindex pipeline on a schedule -- the natural way to run
# a batch-oriented data pipeline (as opposed to a long-lived HTTP service).
# An `initContainer` running `toolkit health-check` acts as the readiness
# gate: the main container only starts once every connector can be reached,
# giving CronJob the equivalent of a /readyz check before doing real work.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: doc-pipeline-reindex
  namespace: doc-pipeline-toolkit
spec:
  # Every 6 hours. Adjust to match your source systems' actual change rate
  # -- delta indexing makes frequent runs cheap for unchanged documents.
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: doc-pipeline-toolkit
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
          initContainers:
            - name: health-check
              image: langchain-document-pipeline-toolkit:latest
              command: ["toolkit", "health-check"]
              envFrom:
                - configMapRef:
                    name: doc-pipeline-toolkit-config
              volumeMounts:
                - name: state
                  mountPath: /app/data
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: ["ALL"]
          containers:
            - name: reindex
              image: langchain-document-pipeline-toolkit:latest
              command: ["toolkit", "reindex"]
              envFrom:
                - configMapRef:
                    name: doc-pipeline-toolkit-config
              volumeMounts:
                - name: state
                  mountPath: /app/data
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: doc-pipeline-toolkit-state
